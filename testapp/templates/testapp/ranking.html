<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"/>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
    <title>ARC'TERYX CLIMBING DAY Vol.2 2025</title>
</head>
<body>
    <div class="fixed-header">
        <h2>Live Result (Category : {{ player.category | upper}})</h2>
        <div class="buttons">
        <button class="white" onclick="location.href='/rules/{{player.UUID}}'">ルール / Rules</button>
        <button onclick="location.href='/input/{{player.UUID}}'" class="red">記録フォームへ</button>
        </div>
    </div>
    <div class="body-offset2">
    <table class="ranking-table">
        <tr>
            <th>Rank</th>
            <th>Name</th>
            <th>Score</th>
        </tr>
        {% for i in ranking_list %}
            {% if i.highlight%}
            <tr class="highlighted-row" id="section">
                <td>{{ i.rank }}</td>
                <td>{{ i.name }}</td>
                <td>{{ i.score }} pt</td>
            </tr>
            {% else %}
            <tr>
                <td>{{ i.rank }}</td>
                <td>{{ i.name }}</td>
                <td>{{ i.score }} pt</td>
            {% endif %}
        </tr>
        {% endfor %}
    </table>
    </div>
    
    <footer>
        <p> Judgesheet Assistant made by T4 and kaiz. </p>
    </footer>
</body>
</html>
